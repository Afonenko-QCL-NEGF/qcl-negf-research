schema: qcl-negf-study-v2
kind: study
id: operator-metrics
name: Operator metric checks
tags:
- research
- analytical
- 70k
- reference-2019
purpose: diagnostic
operation: operator_metrics
configuration:
  sources:
  - ../model/reference-2019-70k.yaml
  - ../policies/analytical-diagnostic.yaml
  overrides: {}
axes:
  temperatures:
    values:
    - 70
    unit: K
  voltages:
    values:
    - 0
    unit: mV
policies:
  scba_to_poisson: adaptive_working
  voltage:
    mode: independent
    invalid_predecessor: stop_branch
  on_child_failure: continue
output:
  archive:
    full_final: true
    projections: false
    optical: false
    intermediate_history: 64
  recovery:
    enabled: true
    interval_seconds: 1800.0
    retain_generations: 2
    byte_budget: 8589934592
    reserve_bytes: 67108864
  telemetry:
    enabled: true
    buffer_events: 256
