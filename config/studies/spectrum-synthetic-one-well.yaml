schema: qcl-negf-study-v2
kind: study
id: spectrum-synthetic-one-well
name: Synthetic one-well spectrum and basis
tags:
- research
- analytical
- 70k
- synthetic-one-well
purpose: diagnostic
operation: structure_spectrum
configuration:
  sources:
  - ../model/common-comparison-70k.yaml
  - ../model/synthetic-one-well-70k.yaml
  - ../policies/analytical-diagnostic.yaml
  overrides:
    numerical:
      basis_states: 5
      basis_periods: 3
axes:
  temperatures:
    values:
    - 70
    unit: K
  voltages:
    values:
    - 0
    - 8
    unit: mV
policies:
  scba_to_poisson: adaptive_working
  voltage:
    mode: independent
    invalid_predecessor: stop_branch
  on_child_failure: continue
output:
  archive:
    full_final: true
    projections: false
    optical: false
    intermediate_history: 64
  recovery:
    enabled: true
    interval_seconds: 1800.0
    retain_generations: 2
    byte_budget: 8589934592
    reserve_bytes: 67108864
  telemetry:
    enabled: true
    buffer_events: 256
variants:
- id: baseline
  method_id: baseline
  overrides: {}
  controlled_paths: []
  comparison_kind: discretization
- id: basis7
  method_id: basis7
  overrides:
    numerical:
      basis_states: 7
  controlled_paths:
  - numerical.basis_states
  comparison_kind: discretization
- id: basis9
  method_id: basis9
  overrides:
    numerical:
      basis_states: 9
  controlled_paths:
  - numerical.basis_states
  comparison_kind: discretization
- id: basis-window5
  method_id: basis-window5
  overrides:
    numerical:
      basis_periods: 5
  controlled_paths:
  - numerical.basis_periods
  comparison_kind: discretization
- id: basis-window7
  method_id: basis-window7
  overrides:
    numerical:
      basis_periods: 7
  controlled_paths:
  - numerical.basis_periods
  comparison_kind: discretization
- id: z192
  method_id: z192
  overrides:
    numerical:
      spatial_nodes: 192
  controlled_paths:
  - numerical.spatial_nodes
  comparison_kind: discretization
