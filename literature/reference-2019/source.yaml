digitization:
  file: negf_iv_digitized.csv
  source_figure: Fig.3b
  source_curve: NEGF IV solid black
  method: Vector path extracted from the author arXiv figure; horizontal scale converted
    to voltage per period and vertical scale converted to J.
  calibration: The publication statement that the maximum is at 56 mV/period fixes
    the voltage-per-period scale.
  uncertainty_scope: Digitization only; the article publishes neither raw NEGF values
    nor model uncertainty.
  caveat: Do not score points outside the published curve; the digitized data cover
    40–60 mV per period.
comparison_scope:
  valid:
  - exact epitaxial layer sequence and sheet doping
  - active-region current density versus voltage per period at 200 K
  - bias of the calculated current maximum
  - diagnostic bare-bubble peak-energy trend
  excluded:
  - terminal device voltage and current
  - threshold current
  - light-current curve and output power
  - maximum operating temperature
  - absolute modal or material gain
  reasons:
  - contacts and series resistance are absent
  - electric-field domains are absent
  - cavity and waveguide losses are absent
  - photon dynamics and lasing clamp are absent
  - electron-electron self-energy and vertex corrections are absent
device_periods:
  status: not directly published
  inferred_from_figure_and_56mV_anchor: approximately 391
  policy: Compare J directly against voltage_per_period; never gate on terminal voltage.
  model_output_value: 405
